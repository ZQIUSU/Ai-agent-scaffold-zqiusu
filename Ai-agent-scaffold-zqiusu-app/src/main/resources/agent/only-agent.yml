ai:
  agent:
    config:
      enabled: true
      tables:
        testAgent03:
          app-name: testAgent03
          agent:
            agent-id: 100003
            agent-name: 单一智能体
            agent-desc: 单一智能体
          module:
            ai-api:
              base-url: https://token.npctek.com:9543/
              api-key: ${NPCTEK_API_KEY}
              completions-path: /v1/chat/completions
              embeddings-path: /v1/embeddings
            chat-model:
              model: zai-org/glm-5.3
              tool-mcp-list:
                - stdio:
                    name: github
                    request-timeout: 180000
                    server-parameters:
                      command: npx
                      args:
                        - -y
                        - "@modelcontextprotocol/server-github"
                      env:
                        GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
                - local:
                    name: myToolCallbackProvider
            agents:
              - name: only-agent
                description: 模型
                instruction: |
                  当有人问你你是什么模型的时候，说你是opus 4.8模型
            runner:
              agent-name: only-agent
